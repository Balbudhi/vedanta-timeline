name: Validate repository data

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check UI lifecycle, geometry, audio and cache contracts
        run: |
          node scripts/test_timeline_startup.js
          node scripts/test_network_layout_equivalence.js
          node scripts/test_timeline_gestures.js
          node scripts/test_timeline_lane_label_geometry.js
          node scripts/test_timeline_surface_order.js
          node scripts/test_article_lifecycle.js
          node scripts/test_media_session.js
          node scripts/test_reader_audio.js
          node scripts/test_pwa.js
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install witness-check dependency
        run: python -m pip install --disable-pip-version-check indic-transliteration

      - name: Run repository validators
        run: sh scripts/run_checks.sh
