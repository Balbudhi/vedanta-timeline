name: Validate repository data

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install witness-check dependency
        run: python -m pip install --disable-pip-version-check indic-transliteration

      - name: Run repository validators
        run: sh scripts/run_checks.sh
